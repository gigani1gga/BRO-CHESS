name: Build APK

on:
  push:
    paths-ignore:
      - '**.zip'
      - '**.md'
      - '.organized-zips'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  SF_TAG: sf_17

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Skip if this exact commit is already built
        id: gate
        run: |
          head=$(git rev-parse HEAD)
          built=$(git ls-remote origin refs/tags/latest | cut -f1)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$head" = "$built" ]; then
            echo "Commit $head already built - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Stockfish cache
        if: steps.gate.outputs.skip != 'true'
        id: sfcache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs
          key: stockfish-${{ env.SF_TAG }}-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Build Stockfish for Android
        if: steps.gate.outputs.skip != 'true' && steps.sfcache.outputs.cache-hit != 'true'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          echo "Using NDK at $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch "$SF_TAG" https://github.com/official-stockfish/Stockfish.git /tmp/sf
          cd /tmp/sf/src
          make net || echo "::warning::make net failed; the build step will retry the download"

          build_abi() {
            make clean >/dev/null 2>&1 || true
            rm -f stockfish
            if make -j"$(nproc)" build ARCH="$2" COMP="$4" CXX="$3-clang++"; then
              mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$1"
              cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/$1/libstockfish.so"
              echo "Built Stockfish for $1"
            else
              echo "::warning::Stockfish build failed for $1"
            fi
          }
          build_abi arm64-v8a   armv8       aarch64-linux-android26     ndk
          build_abi armeabi-v7a armv7-neon  armv7a-linux-androideabi26  ndk
          build_abi x86_64      x86-64      x86_64-linux-android26      clang

      - name: Save Stockfish cache
        if: steps.gate.outputs.skip != 'true' && steps.sfcache.outputs.cache-hit != 'true' && hashFiles('app/src/main/jniLibs/arm64-v8a/libstockfish.so') != ''
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs
          key: stockfish-${{ env.SF_TAG }}-${{ hashFiles('.github/workflows/android.yml') }}

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          gradle-version: '8.9'

      - name: Unit tests
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        id: tests
        run: gradle --no-daemon --console=plain testDebugUnitTest

      - name: Build signed release APK
        if: steps.gate.outputs.skip != 'true'
        run: gradle --no-daemon --console=plain assembleRelease -PversionCode=$((100 + ${{ github.run_number }}))

      - name: Verify signature and Stockfish
        if: steps.gate.outputs.skip != 'true'
        id: verify
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" ChessLab.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs ChessLab.apk | grep 'certificate SHA-256' | head -1)
          SF=$(unzip -l ChessLab.apk | grep -c libstockfish.so || true)
          {
            echo "### Chess Lab build $((100 + ${{ github.run_number }}))"
            echo "- Signing key: \`$CERT\` (identical on every build)"
            echo "- Stockfish libraries in APK: **$SF**"
            echo "- Unit tests: ${{ steps.tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SF" = "0" ]; then echo "::warning::APK built WITHOUT Stockfish (see Stockfish build step)"; fi

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ChessLab-apk
          path: ChessLab.apk

      - name: Move the 'latest' tag to this commit
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Publish release (permanent download link)
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chess Lab (build ${{ github.run_number }})
          body: |
            Latest signed APK, built from commit ${{ github.sha }}.
            Install over the previous version - same signing key, higher version code.
          files: ChessLab.apk
          make_latest: true
          fail_on_unmatched_files: true
