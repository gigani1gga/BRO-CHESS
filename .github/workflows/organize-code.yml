name: Organize code

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-code
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect new zips, unzip and organize
        run: |
          shopt -s globstar nullglob
          touch .organized-zips
          for z in **/*.zip; do
            case "$z" in */build/*|node_modules/*) continue;; esac
            h=$(sha256sum "$z" | cut -d' ' -f1)
            if grep -qx "$h" .organized-zips; then echo "Skip (already done): $z"; continue; fi
            echo "Processing: $z"
            d=$(mktemp -d)
            unzip -q -o "$z" -d "$d" -x '__MACOSX/*' '*.DS_Store' || [ $? -eq 11 ] || true
            while [ "$(ls -A "$d" | wc -l)" = 1 ] && [ -d "$d/$(ls -A "$d")" ] && ! [[ "$(ls -A "$d")" =~ ^(app|gradle)$ ]]; do
              d="$d/$(ls -A "$d")"
            done
            rm -rf "$d/.github"
            cp -a "$d"/. .
            echo "$h" >> .organized-zips
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Organize uploaded code"
          git push
