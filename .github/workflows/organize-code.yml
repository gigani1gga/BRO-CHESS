name: Organize code

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: organize-code
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip and organize
        run: |
          set -uo pipefail
          shopt -s nullglob

          last_org=$(git log -1 --grep='^Organize uploaded code$' --format=%ct 2>/dev/null || true)
          last_org=${last_org:-0}
          mapfile -t zips < <(
            for z in *.zip; do
              t=$(git log -1 --format=%ct -- "$z")
              if [ "${t:-0}" -gt "$last_org" ]; then printf '%s\t%s\n' "$t" "$z"; fi
            done | sort -n | cut -f2-
          )

          echo "Zips to process: ${#zips[@]}"
          for z in "${zips[@]}"; do echo "  - $z"; done

          for z in "${zips[@]}"; do
            [ -f "$z" ] || { echo "Missing $z, skipping"; continue; }
            echo "=== Processing: $z"
            d=$(mktemp -d)
            rc=0
            unzip -q -o "$z" -d "$d" -x '__MACOSX/*' '*.DS_Store' || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] && [ "$rc" -ne 11 ]; then
              echo "::error::unzip failed for $z (exit $rc)"
              continue
            fi
            while :; do
              [ "$(ls -A "$d" | wc -l)" = "1" ] || break
              only="$d/$(ls -A "$d")"
              [ -d "$only" ] || break
              case "$(basename "$only")" in app|gradle|.github) break;; esac
              echo "Entering wrapper folder: $(basename "$only")"
              d="$only"
            done
            rm -rf "$d/.github"
            echo "Top level of zip:"; ls -A "$d"
            cp -a "$d"/. .
            git rm -q -f "$z" || rm -f "$z"
          done

      - name: Commit, push, start build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to organize in this push."
            exit 0
          fi
          echo "Files changed:"
          git diff --cached --stat | tail -40
          git commit -m "Organize uploaded code"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "::error::Could not push after 3 attempts"; exit 1; fi
          echo "Starting APK build..."
          gh workflow run android.yml --ref "${{ github.ref_name }}"
